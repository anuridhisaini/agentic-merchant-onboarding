<svg width="680" height="520" viewBox="0 0 680 520" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#555" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="680" height="520" fill="#ffffff"/>

  <!-- Application intake -->
  <rect x="190" y="40" width="300" height="56" rx="8" fill="#eef0f2" stroke="#9aa0a6" stroke-width="1"/>
  <text x="340" y="60" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">Application intake</text>
  <text x="340" y="78" text-anchor="middle" font-size="12" fill="#555">New merchant application arrives</text>
  <line x1="340" y1="96" x2="340" y2="136" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- KYC doc checker -->
  <rect x="190" y="136" width="300" height="56" rx="8" fill="#efe6fb" stroke="#8a5fd6" stroke-width="1"/>
  <text x="340" y="156" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">KYC doc checker</text>
  <text x="340" y="174" text-anchor="middle" font-size="12" fill="#555">Verifies required documents present</text>
  <line x1="340" y1="192" x2="340" y2="232" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Risk scorer -->
  <rect x="190" y="232" width="300" height="56" rx="8" fill="#efe6fb" stroke="#8a5fd6" stroke-width="1"/>
  <text x="340" y="252" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">Risk scorer</text>
  <text x="340" y="270" text-anchor="middle" font-size="12" fill="#555">Scores industry, geography, volume</text>
  <line x1="340" y1="288" x2="340" y2="328" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Onboarding QA -->
  <rect x="190" y="328" width="300" height="56" rx="8" fill="#efe6fb" stroke="#8a5fd6" stroke-width="1"/>
  <text x="340" y="348" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">Onboarding Q&amp;A</text>
  <text x="340" y="366" text-anchor="middle" font-size="12" fill="#555">Answers merchant questions</text>
  <line x1="340" y1="384" x2="340" y2="424" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Final decision -->
  <rect x="190" y="424" width="300" height="56" rx="8" fill="#dff3ef" stroke="#3fae94" stroke-width="1"/>
  <text x="340" y="444" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">Final decision</text>
  <text x="340" y="462" text-anchor="middle" font-size="12" fill="#555">Approve, reject, or escalate</text>
</svg>
