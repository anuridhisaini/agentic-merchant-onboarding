<svg width="680" height="356" viewBox="0 0 680 356" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <defs>
    <marker id="arrow2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#555" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="680" height="356" fill="#ffffff"/>

  <!-- Any agent call -->
  <rect x="190" y="40" width="300" height="56" rx="8" fill="#eef0f2" stroke="#9aa0a6" stroke-width="1"/>
  <text x="340" y="60" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">Any agent call</text>
  <text x="340" y="78" text-anchor="middle" font-size="12" fill="#555">Watches for 3 failure modes</text>

  <line x1="280" y1="96" x2="140" y2="136" stroke="#555" stroke-width="1.5" marker-end="url(#arrow2)"/>
  <line x1="340" y1="96" x2="340" y2="136" stroke="#555" stroke-width="1.5" marker-end="url(#arrow2)"/>
  <line x1="400" y1="96" x2="540" y2="136" stroke="#555" stroke-width="1.5" marker-end="url(#arrow2)"/>

  <!-- Timeout -->
  <rect x="50" y="136" width="180" height="56" rx="8" fill="#fbe4e1" stroke="#d9694f" stroke-width="1"/>
  <text x="140" y="156" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">Timeout</text>
  <text x="140" y="174" text-anchor="middle" font-size="11.5" fill="#555">Retry once, then escalate</text>

  <!-- Bad input -->
  <rect x="250" y="136" width="180" height="56" rx="8" fill="#fbe4e1" stroke="#d9694f" stroke-width="1"/>
  <text x="340" y="156" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">Bad input</text>
  <text x="340" y="174" text-anchor="middle" font-size="11.5" fill="#555">Caught by validation</text>

  <!-- Disagreement -->
  <rect x="450" y="136" width="180" height="56" rx="8" fill="#fbe4e1" stroke="#d9694f" stroke-width="1"/>
  <text x="540" y="156" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">Disagreement</text>
  <text x="540" y="174" text-anchor="middle" font-size="11.5" fill="#555">KYC vs risk conflict</text>

  <line x1="140" y1="192" x2="280" y2="260" stroke="#555" stroke-width="1.5" marker-end="url(#arrow2)"/>
  <line x1="340" y1="192" x2="340" y2="260" stroke="#555" stroke-width="1.5" marker-end="url(#arrow2)"/>
  <line x1="540" y1="192" x2="400" y2="260" stroke="#555" stroke-width="1.5" marker-end="url(#arrow2)"/>

  <!-- Human escalation -->
  <rect x="190" y="260" width="300" height="56" rx="8" fill="#fcefd9" stroke="#d6a13f" stroke-width="1"/>
  <text x="340" y="280" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">Human escalation</text>
  <text x="340" y="298" text-anchor="middle" font-size="12" fill="#555">Reviewer sees full reasoning trail</text>
</svg>
